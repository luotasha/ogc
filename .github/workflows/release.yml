name: Build and Release

on:
  push:
    branches: [main, "custom/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go test ./... -race
      - run: go vet ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: darwin, arch: amd64, suffix: "" }
          - { os: darwin, arch: arm64, suffix: "" }
          - { os: linux, arch: amd64, suffix: "" }
          - { os: linux, arch: arm64, suffix: "" }
          - { os: windows, arch: amd64, suffix: ".exe" }
          - { os: windows, arch: arm64, suffix: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Build both proxies
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/ogc_${GOOS}-${GOARCH}${{ matrix.suffix }}" ./cmd/ogc
          go build -trimpath -ldflags "-s -w" -o "dist/ogc-reasoning-proxy_${GOOS}-${GOARCH}${{ matrix.suffix }}" ./cmd/ogc-reasoning-proxy
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
